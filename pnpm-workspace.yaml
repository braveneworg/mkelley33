# pnpm settings live here rather than in .npmrc: AGENTS.md hard constraint #2
# forbids agents from reading .npmrc, which would leave install behaviour
# impossible to diagnose.

# package.json's engines field only prints a warning on mismatch and lets the
# install succeed, so the Node 24 / pnpm 11 pin would otherwise be advisory
# only. engineStrict turns a mismatch into a non-zero exit.
engineStrict: true

# pnpm 11 promoted "ignored build scripts" from a warning to a hard error
# (ERR_PNPM_IGNORED_BUILDS), which also disables pnpm exec/run, so every
# dependency with a postinstall must be approved explicitly. All four place or
# fetch native binaries:
#   esbuild, unrs-resolver — platform-specific binaries
#   sharp                  — libvips, backs next/image optimisation
#   mongodb-memory-server  — fetches the mongod binary at install time instead
#                            of lazily on first use, where the download could
#                            exceed the 120s hookTimeout in the *.int.test.ts
#                            suites and fail them on a cold cache
allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  sharp: true
  unrs-resolver: true

# Moved here from package.json's "pnpm" field, which pnpm 11 no longer reads
# (it warns and ignores the keys). Both plugins declare a peer range stopping
# at ESLint 9 but work correctly on the 10 this repo uses.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'

# GHSA-r28c-9q8g-f849 (Dependabot #1): postcss <= 8.5.17 can disclose
# arbitrary .map files via sourceMappingURL auto-loading. The direct dep is
# already safe; this lifts the one vulnerable copy — next pins postcss
# 8.4.31 — without touching resolutions that are already patched. Scoped to
# the advisory range so it self-retires once next's own pin catches up.
#
# The rest date from the 2026-08-02 `pnpm audit` sweep (33 advisories, 1
# critical: tar GHSA-23hp-3jrh-7fpw) and the 2026-09-03 follow-up sweep (21
# new advisories accumulated in the month between). Each floors a vulnerable
# range at its first patched version, scoped to the advisory range like the
# postcss entry so it self-retires once the declaring parent catches up;
# caret values keep resolution inside the current major so no parent crosses
# a breaking boundary. Every floored version had been published well over
# 24h before its sweep, so none needs a minimumReleaseAgeExclude entry.
# mongoose is here because @payloadcms/db-mongodb pins it exactly (8.24.1 as
# of payload 3.93), so an override is the only path to the patch. The
# 2026-09-03 sweep raised the dompurify and js-yaml floors (their previous
# floors became the newly vulnerable versions) and floored undici's 7.x line
# (payload's copy).
#
# The 2026-11-15 Dependabot sweep raised the brace-expansion, dompurify,
# fast-uri, mongoose, smol-toml and undici 7.x floors the same way, and added
# six: fast-copy, follow-redirects, source-map-js, undici's 6.x line
# (@vercel/blob's copy), vite (vitest's copy) and zod's 4.x line (the vercel
# CLI's copies). It also added the entries that are not plain advisory
# floors, because each one crosses a major the declaring parent did not ask
# for:
#
#   happy-dom@<21.0.4 — the only release clear of GHSA-834v-8h66-3h79 is a
#   major up from the ^20.9.0 that @lexical/headless@0.50.0 declares
#   (payload's richtext-lexical pins that lexical exactly). Upstream made the
#   identical move — @lexical/headless 0.53 declares ^21.0.4 — so this
#   self-retires when payload's lexical pin reaches it.
#
#   glob@<14.0.2 and minimatch@<11.0.1 — both advisories are patched only in
#   the next major, and the two have to move together: glob 13 is written
#   against the minimatch 10 internals that 11 replaced. They reach eslint,
#   typescript-eslint and @serwist/build, so `pnpm gate` and `pnpm build`
#   are what prove them. minimatch 3.x (eslint 9's copy) is outside the
#   advisory range and untouched.
#
#   undici@5.x — the vercel CLI pins undici 5.29.0 exactly, still does at
#   its latest release (65.16.0), and 5.x has no patched release. The CLI
#   only builds an `Agent` and a `ProxyAgent` from it, which 6.x constructs
#   and dispatches identically; `vercel whoami` and `vercel project ls` were
#   run through both the direct and the proxy branch on 6.29.1. What that
#   cannot cover is the upload in `vercel deploy`. If the deploy job fails
#   inside the CLI rather than in the build, delete this entry first.
overrides:
  '@tootallnate/once@<2.0.1': ^2.0.1
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist@<=4.28.6: ^4.28.7
  dompurify@<3.4.17: ^3.4.17
  fast-copy@>=3.0.0 <3.1.0: ^3.1.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  follow-redirects@>=1.16.0 <1.16.2: ^1.16.2
  glob@>=9.0.0 <14.0.2: ^14.0.2
  happy-dom@<21.0.4: ^21.0.4
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  mongoose@>=8.0.0 <8.24.7: ^8.24.7
  nanoid@>=3.0.0 <3.3.18: ^3.3.18
  path-to-regexp@>=8.0.0 <8.4.0: ^8.4.0
  'postcss@<8.5.18': '>=8.5.18'
  smol-toml@<1.8.1: ^1.8.1
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  tar@<7.5.21: ^7.5.21
  undici@>=5.0.0 <6.0.0: ^6.29.1
  undici@>=6.0.0 <6.29.1: ^6.29.1
  undici@>=7.0.0 <7.30.1: ^7.30.1
  vite@>=8.0.0 <8.1.6: ^8.1.6
  zod@>=4.0.0 <4.6.6: ^4.6.6

# Accepted advisories: each has no usable fix, and is scoped to its exact
# GHSA so anything new still fails `pnpm audit` loudly.
#
# GHSA-mrhx-c7xc-m3w5 (zod <4.6.6, memory exhaustion validating oversized
# collections): every 4.x copy is floored above, but @vercel/python-analysis
# pins zod 3.22.4 exactly — still does at its latest release — and no 3.x
# patch exists. Forcing zod 4 into code written against zod 3 is an API
# break that nothing here can exercise: the package only analyses Python
# projects during `vercel build`, which the runner never runs. Delete once
# `pnpm why zod` shows no 3.x.
#
# GHSA-gcqx-w48m-w2h4 (deepmerge <=4.3.1, prototype poisoning of the
# returned object, low): payload depends on deepmerge 4.3.1, which is the
# latest release — the advisory names 4.3.2 but it has not been published.
# Delete and floor deepmerge instead once it is.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-gcqx-w48m-w2h4
