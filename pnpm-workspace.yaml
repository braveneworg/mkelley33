# pnpm settings live here rather than in .npmrc: AGENTS.md hard constraint #2
# forbids agents from reading .npmrc, which would leave install behaviour
# impossible to diagnose.

# package.json's engines field only prints a warning on mismatch and lets the
# install succeed, so the Node 24 / pnpm 11 pin would otherwise be advisory
# only. engineStrict turns a mismatch into a non-zero exit.
engineStrict: true

# pnpm 11 promoted "ignored build scripts" from a warning to a hard error
# (ERR_PNPM_IGNORED_BUILDS), which also disables pnpm exec/run, so every
# dependency with a postinstall must be approved explicitly. All four place or
# fetch native binaries:
#   esbuild, unrs-resolver — platform-specific binaries
#   sharp                  — libvips, backs next/image optimisation
#   mongodb-memory-server  — fetches the mongod binary at install time instead
#                            of lazily on first use, where the download could
#                            exceed the 120s hookTimeout in the *.int.test.ts
#                            suites and fail them on a cold cache
allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  sharp: true
  unrs-resolver: true

# Moved here from package.json's "pnpm" field, which pnpm 11 no longer reads
# (it warns and ignores the keys). Both plugins declare a peer range stopping
# at ESLint 9 but work correctly on the 10 this repo uses.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'

# GHSA-r28c-9q8g-f849 (Dependabot #1): postcss <= 8.5.17 can disclose
# arbitrary .map files via sourceMappingURL auto-loading. The direct dep is
# already safe; this lifts the one vulnerable copy — next pins postcss
# 8.4.31 — without touching resolutions that are already patched. Scoped to
# the advisory range so it self-retires once next's own pin catches up.
#
# The rest date from the 2026-08-02 `pnpm audit` sweep (33 advisories, 1
# critical: tar GHSA-23hp-3jrh-7fpw) and the 2026-09-03 follow-up sweep (21
# new advisories accumulated in the month between). Each floors a vulnerable
# range at its first patched version, scoped to the advisory range like the
# postcss entry so it self-retires once the declaring parent catches up;
# caret values keep resolution inside the current major so no parent crosses
# a breaking boundary. Every floored version had been published well over
# 24h before its sweep, so none needs a minimumReleaseAgeExclude entry.
# mongoose is here because @payloadcms/db-mongodb pins it exactly (8.22.1),
# so an override is the only path to the patch. The 2026-09-03 sweep raised
# the dompurify and js-yaml floors (their previous floors became the newly
# vulnerable versions) and floored undici's 7.x line (payload's copy); the
# vercel CLI's undici@5.29.0 stays unfixable and accepted in auditConfig
# below, as do image-size (no patched release exists at all) and sharp
# (the `sharp@<0.35.0: ^0.35.0` override took production down — see
# src/sharp-pin.spec.ts — and was reverted).
overrides:
  '@tootallnate/once@<2.0.1': ^2.0.1
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  browserslist@<=4.28.6: ^4.28.7
  dompurify@<3.4.13: ^3.4.13
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  minimatch@>=10.0.0 <10.2.3: ^10.2.3
  mongoose@>=8.0.0 <8.24.1: ^8.24.1
  nanoid@>=3.0.0 <3.3.18: ^3.3.18
  path-to-regexp@>=8.0.0 <8.4.0: ^8.4.0
  'postcss@<8.5.18': '>=8.5.18'
  smol-toml@<1.6.1: ^1.6.1
  tar@<7.5.21: ^7.5.21
  undici@>=7.0.0 <7.29.0: ^7.29.0

# The twelve undici advisories below all describe undici@5.29.0, the HTTP
# client the vercel CLI pins (still, even at 59.11.2, its latest as of
# 2026-09-03) — a devDependency that only talks to Vercel's own API during
# deploys. undici 5.x has no patched release, so the only "fix" would be an
# override forcing the CLI onto a newer API-incompatible major that risks
# breaking `vercel deploy` in CI. Accepted instead, scoped to these exact
# GHSAs so anything new still fails `pnpm audit` loudly. The last three
# (8xcm/m8rv/v3r7, added by the 2026-09-03 sweep) also matched payload's
# undici@7.28.0, but that instance is FIXED by the 7.x override above —
# the acceptance only masks the CLI's 5.29.0 copy. Delete those twelve
# entries once `pnpm why undici` shows the CLI off 5.x after a vercel
# update.
#
# GHSA-f88m-g3jw-g9cj (sharp <0.35.0, libvips-inherited CVEs, patched only
# in 0.35.0): accepted because sharp 0.35.x is unusable on Vercel — its
# @img/sharp-libvips-linux-x64 shared library is not traced into the
# function bundle (lovell/sharp#4567), so every lambda throws
# ERR_DLOPEN_FAILED at cold start and the whole dynamic layer 500s. That
# outage ran 2026-08-02 → 2026-09-03 in production; the vulnerable surface,
# by contrast, is image parsing of admin-uploaded media only — no untrusted
# user uploads reach sharp. src/sharp-pin.spec.ts enforces the pin. Delete
# this entry and re-bump sharp once 0.35.x is confirmed traceable on Vercel
# and /admin is verified on a deploy.
#
# GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq (image-size <=2.0.2, ICNS and
# JXL/HEIF parser DoS): accepted 2026-09-03 because NO patched release
# exists — the advisories claim >=2.0.3 but npm's latest is the vulnerable
# 2.0.2, so there is nothing to floor to. Both copies in the graph
# (payload's 2.0.2 and a transitive 0.6.4) parse admin-uploaded media only.
# Delete these two entries and floor image-size instead once a release
# above 2.0.2 is published.
auditConfig:
  ignoreGhsas:
    - GHSA-f88m-g3jw-g9cj
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-vrm6-8vpv-qv8q
    - GHSA-v9p9-hfj2-hcw8
    - GHSA-vxpw-j846-p89q
    - GHSA-g9mf-h72j-4rw9
    - GHSA-2mjp-6q6p-2qxm
    - GHSA-4992-7rv2-5pvq
    - GHSA-p88m-4jfj-68fv
    - GHSA-35p6-xmwp-9g52
    - GHSA-g8m3-5g58-fq7m
    - GHSA-8xcm-r25x-g524
    - GHSA-m8rv-5g2x-5cg5
    - GHSA-v3r7-h72x-cjcm
