name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # `pnpm gate` is THE gate — the same script .husky/pre-push runs and the
  # same one AGENTS.md tells contributors to run. Keep this job calling it
  # rather than listing the checks again: the three copies this replaced had
  # already drifted apart, and CI's was the one missing format:check.
  # src/gate.spec.ts fails if a check is spelled out here instead.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm gate
      - run: pnpm build:ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # The CI reporter is `github`, which writes no playwright-report/ —
      # the retained diagnostics are the retain-on-failure traces in
      # test-results/.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  # Production deploy to Vercel — push-to-main only, after both gates.
  #
  # GitHub secrets required (repo Settings → Secrets and variables → Actions):
  #   VERCEL_TOKEN       personal token from vercel.com/account/tokens
  #   VERCEL_ORG_ID      "orgId" in .vercel/project.json after `vercel link`
  #   VERCEL_PROJECT_ID  "projectId" in the same file
  #
  # App runtime/build env (DATABASE_URL, SMTP_*, Turnstile keys, …) lives in
  # the Vercel project env, NOT here — serverless functions read it at
  # runtime, so GitHub secrets cannot carry it. The preflight step audits the
  # pulled env against src/lib/deploy/env-manifest.ts and fails the deploy
  # naming anything missing or forbidden. See docs/deploy.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          # No memory server runs here, so the binary cache is dead weight.
          mongodb-binaries-cache: 'false'
      - name: Pull Vercel project settings and production env
        run: pnpm exec vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Audit production env against the manifest
        run: pnpm exec tsx scripts/check-deploy-env.ts .vercel/.env.production.local
      # Vercel builds this, not the runner. `vercel pull` returns a redaction
      # marker for every variable stored as sensitive, so a runner-side
      # `vercel build` compiles production against those markers instead of
      # the real DATABASE_URL, PAYLOAD_SECRET, SMTP_* and Turnstile values.
      # See src/deploy-workflow.spec.ts, which pins this.
      - name: Deploy to production (built on Vercel)
        run: pnpm exec vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
