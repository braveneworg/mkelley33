name: Set up the toolchain
description: >-
  pnpm, Node from mise.toml, the caches a job needs, and a frozen-lockfile
  install — the block every job in ci.yml used to repeat verbatim.

# Callers must run actions/checkout FIRST. A local composite action is read
# from the workspace, so the runner cannot resolve `./.github/actions/setup`
# until the repository is on disk; checkout is the one setup step that cannot
# move in here.

inputs:
  mongodb-binaries-cache:
    description: >-
      Restore the mongodb-memory-server binary cache, and let the package's
      postinstall download the binary on a cache miss. The gate's integration
      specs start a memory server and need it; the e2e and deploy jobs never
      do, and paying for the restore or the download there would slow them
      for nothing.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    # v7.1.0 is the first setup-node that reads the node tool out of
    # mise.toml; earlier majors accept the input and then fail to parse it.
    - uses: actions/setup-node@v7
      with:
        node-version-file: mise.toml
        cache: pnpm
    - if: inputs.mongodb-binaries-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/mongodb-binaries
        key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          mongodb-binaries-${{ runner.os }}-
    # --trust-lockfile skips pnpm 11's supply-chain re-verification of every
    # lockfile entry. The lockfile is reviewed in the PR diff before it lands,
    # so it is part of the trusted base here; local installs keep the full
    # minimumReleaseAge quarantine, which is where an unreviewed new version
    # would actually appear. Without this, CI fails whenever any locked
    # dependency was published within the last 24h.
    - run: pnpm install --frozen-lockfile --trust-lockfile
      shell: bash
      env:
        # mongodb-memory-server fetches its mongod binary at install time. A
        # job that opted out of the cache above never starts one, so it skips
        # the download as well. src/docker-policy.spec.ts pins this.
        MONGOMS_DISABLE_POSTINSTALL: ${{ inputs.mongodb-binaries-cache == 'true' && '0' || '1' }}
